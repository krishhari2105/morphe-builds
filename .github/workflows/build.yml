name: Build patched apps

on:
  workflow_dispatch:
    inputs:
      patch_sources:
        description: "Patch sources (comma-separated, 'scheduled', or 'all')"
        required: true
        default: "morphe"
        type: string
      apps:
        description: "Apps (comma-separated or 'all')"
        required: true
        default: "all"
        type: string
      version_overrides:
        description: "Per-app versions as JSON, for example {\"youtube\":\"20.12.46\"}"
        required: false
        default: "{}"
        type: string
      base_urls:
        description: "Manual per-app direct download URLs as JSON (fallback when APKMirror blocks Actions)"
        required: false
        default: "{}"
        type: string
      publish:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      patch_sources:
        required: true
        type: string
      apps:
        required: false
        default: "all"
        type: string
      version_overrides:
        required: false
        default: "{}"
        type: string
      base_urls:
        required: false
        default: "{}"
        type: string
      publish:
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.matrix.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: matrix
        env:
          SOURCES: ${{ inputs.patch_sources || github.event.client_payload.source || 'morphe' }}
        run: python -m morphe_builder matrix --sources "$SOURCES"

  unsigned:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ${{ fromJSON(needs.prepare.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: morphe-prepare-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Android build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            .cache/bases
          key: morphe-assets-${{ runner.os }}-${{ github.run_id }}-${{ matrix.source }}
          restore-keys: |
            morphe-assets-${{ runner.os }}-
      - name: Remove tracked legacy key before upstream code runs
        run: rm -f morphe.keystore
      - name: Prepare unsigned ${{ matrix.source }} build
        env:
          APPS: ${{ inputs.apps || 'all' }}
          VERSION_OVERRIDES: ${{ inputs.version_overrides || '{}' }}
          BASE_URLS: ${{ inputs.base_urls || '{}' }}
        run: |
          python -m morphe_builder prepare \
            --source "${{ matrix.source }}" \
            --apps "$APPS" \
            --version-overrides "$VERSION_OVERRIDES" \
            --base-urls "$BASE_URLS"
      - name: Upload prepared unsigned build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-${{ matrix.source }}-${{ github.run_id }}
          path: |
            staging/${{ matrix.source }}/
            artifacts/${{ matrix.source }}/
          if-no-files-found: error
          retention-days: 2
      - name: Upload preparation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepare-failed-${{ matrix.source }}-${{ github.run_id }}
          path: artifacts/${{ matrix.source }}/
          if-no-files-found: ignore
          retention-days: 14

  sign-and-publish:
    needs: [prepare, unsigned]
    if: needs.prepare.result == 'success' && needs.unsigned.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ${{ fromJSON(needs.prepare.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: morphe-publish-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Android build tools and BKS provider
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libbcprov-java
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-${{ matrix.source }}-${{ github.run_id }}
          path: .
      - name: Remove tracked legacy key
        run: rm -f morphe.keystore
      - name: Sign, verify, and publish ${{ matrix.source }}
        env:
          PUBLISH: ${{ inputs.publish }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_TYPE: ${{ secrets.SIGNING_KEYSTORE_TYPE }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
          BCPROV_JAR: /usr/share/java/bcprov.jar
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Configure SIGNING_KEYSTORE_B64 before running signed builds."
            exit 1
          fi
          PUBLISH_FLAG=--publish
          if [ "$PUBLISH" = "false" ]; then PUBLISH_FLAG=--no-publish; fi
          python -m morphe_builder finalize --source "${{ matrix.source }}" "$PUBLISH_FLAG"
      - name: Upload signed diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morphe-${{ matrix.source }}-${{ github.run_id }}
          path: |
            artifacts/${{ matrix.source }}/
            dist/${{ matrix.source }}/
          if-no-files-found: ignore
          retention-days: 14
