name: Watch Morphe releases

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      sources: ${{ steps.check.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m morphe_builder check-upstreams --sources scheduled

  build:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.check.outputs.sources) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      patch_sources: ${{ matrix.source }}
      apps: all
      version_overrides: "{}"
      base_urls: "{}"
      publish: true
    secrets: inherit
