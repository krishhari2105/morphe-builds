name: Build hoo-dles Proton VPN

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "App to patch"
        required: true
        default: all
        type: choice
        options: [all, proton-vpn]
      version_overrides:
        description: "Optional exact app versions as JSON"
        required: false
        default: "{}"
        type: string
      base_url:
        description: "Optional direct URL for the selected app"
        required: false
        default: ""
        type: string
      base_urls:
        description: "Advanced: direct URLs as JSON"
        required: false
        default: "{}"
        type: string
      publish:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      patch_sources: hoo-dles
      apps: ${{ inputs.apps }}
      version_overrides: ${{ inputs.version_overrides }}
      base_url: ${{ inputs.base_url }}
      base_urls: ${{ inputs.base_urls }}
      publish: ${{ inputs.publish }}
    secrets: inherit
