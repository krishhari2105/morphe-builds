[project]
name = "morphe-builds"
version = "2.0.0"
description = "Automated Morphe and ReVanced compatible Android app patch and release pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.7.4",
    "charset-normalizer>=3.3.2",
    "idna>=3.7",
    "requests>=2.32.3",
    "urllib3>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".cache",
    ".work",
    "staging",
    "dist",
    "artifacts",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length violations (handled by formatter / max line-length)
]

[tool.ruff.lint.isort]
known-first-party = ["morphe_builder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "^\\.cache/",
    "^\\.work/",
    "^staging/",
    "^dist/",
    "^artifacts/",
]
